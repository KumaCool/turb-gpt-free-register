services:
  turb-gpt-free-register:
    build:
      context: .
    container_name: turb-gpt-free-register
    restart: unless-stopped
    init: true
    shm_size: 2gb
    env_file:
      - .env
    ports:
      - "100.82.139.83:18094:5000"
    dns:
      - 100.100.100.100
      - 8.8.8.8
    volumes:
      - ./:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:5000/login', timeout=5); raise SystemExit(0 if r.status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
